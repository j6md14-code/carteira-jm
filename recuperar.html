<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Recuperar dados · Carteira JM</title>
<style>
:root{--bg:#F4F5F7;--card:#fff;--ink:#151A21;--muted:#667085;--line:#E3E6EB;--ok:#1E9E5A;--bad:#D63B2F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:0}
p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.n{display:flex;gap:8px;flex-wrap:wrap}
.n span{background:#F0F2F5;border-radius:99px;padding:3px 10px;font-weight:700;font-size:.85rem}
button{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;background:var(--ink);color:#fff;cursor:pointer;min-height:44px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Recuperar dados do CRM</h1>
  <p>Esta página procura a cópia dos seus dados que o CRM guarda neste navegador. Ela não apaga nem altera nada.</p>
  <div id="lista"></div>
</main>
<script>
(function(){
  "use strict";
  const lista=document.getElementById("lista");
  const achados=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||k.indexOf("carteira-jm-v1-cache-")!==0)continue;
      try{
        const d=JSON.parse(localStorage.getItem(k)||"{}");
        const c={leads:(d.leads||[]).length,imoveis:(d.imoveis||[]).length,gastos:(d.gastos||[]).length,vendas:(d.vendas||[]).length};
        const total=c.leads+c.imoveis+c.gastos+c.vendas;
        if(total>0)achados.push({k,d,c,total});
      }catch(e){}
    }
  }catch(e){lista.innerHTML='<div class="card"><p class="bad">Este navegador bloqueou a leitura dos dados salvos.</p></div>';return}
  if(!achados.length){
    lista.innerHTML='<div class="card"><p class="bad">Nenhuma cópia com dados foi encontrada neste navegador.</p><p>Tente abrir este mesmo endereço no outro aparelho ou navegador onde você usava o CRM (por exemplo, o Chrome ou o Edge do computador).</p></div>';
    return;
  }
  achados.sort((a,b)=>b.total-a.total);
  lista.innerHTML=achados.map((a,i)=>{
    const nomes=(a.d.leads||[]).slice(0,5).map(l=>l.nome).filter(Boolean).join(", ");
    return '<div class="card"><b>Cópia '+(i+1)+(i===0?' · a mais completa':'')+'</b><div class="n"><span>'+a.c.leads+' leads</span><span>'+a.c.imoveis+' imóveis</span><span>'+a.c.gastos+' gastos</span>'+(a.c.vendas?'<span>'+a.c.vendas+' vendas</span>':'')+'</div>'+(nomes?'<small>Leads: '+nomes.replace(/[<>&]/g,"")+(a.c.leads>5?"…":"")+'</small>':'')+'<button type="button" data-i="'+i+'">Baixar backup desta cópia</button></div>';
  }).join("");
  lista.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const a=achados[Number(b.dataset.i)];
    const backup={app:"carteira-joao-matheus",versao:2,recuperadoEm:new Date().toISOString(),leads:a.d.leads||[],imoveis:a.d.imoveis||[],gastos:a.d.gastos||[],vendas:a.d.vendas||[],config:a.d.config||{},scripts:a.d.scripts||null};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const el=document.createElement("a");
    el.href=url; el.download="backup-recuperado-carteira-jm.json"; document.body.appendChild(el); el.click(); el.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    b.textContent="✓ Backup baixado"; b.style.background="#1E9E5A";
  });
})();
</script>
</body>
</html>
