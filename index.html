<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carteira JM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Carteira João Matheus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Mesa escura do corretor: latão como cor de marca; cada indicador com sua cor; temperatura e etapas com cores semânticas. */
:root{
  color-scheme:light;
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --raised:#EEF1F5; --ink:#151A21; --muted:#667085; --line:#E3E6EB;
  --accent:#A87522; --accent-ink:#FFFFFF; --accent-soft:#FBF3E3; --accent-line:#EAD5AE;
  --primary:#151A21; --primary-ink:#FFFFFF;
  --hot:#E0533D; --warm:#D9930F; --cold:#2F7BD8;
  --teal:#0E9F8E; --violet:#7559E6; --blue:#2F7BD8; --orange:#E0702C; --green:#1E9E5A; --rose:#E0533D; --slate:#8A94A6;
  --good:#1E9E5A; --bad:#D63B2F;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --font-display:"Fraunces","Iowan Old Style","Georgia",serif;
  --font-body:"Manrope",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --r:14px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;
  background:radial-gradient(900px 380px at 92% -10%,rgba(214,170,92,.12),transparent 60%),var(--bg);
  min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

/* Cabeçalho (com espaço do entalhe do iPhone) */
header.top{position:sticky;top:0;z-index:20;padding-top:var(--top);background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
img.mono{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:block;box-shadow:0 2px 8px rgba(16,24,40,.12),0 0 0 1px #EAD5AE}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--font-display);font-weight:600;font-size:1.35rem;margin:0;letter-spacing:-.015em;line-height:1.1;white-space:nowrap}
.brand .role{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700;white-space:nowrap}
.brand .sync{font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
nav.tabs{display:flex;gap:2px}
.tab{border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px;font-size:.92rem}
.tab:hover{color:var(--ink)}
.tab svg{width:18px;height:18px;flex-shrink:0}
.tab[aria-current="page"]{background:var(--primary);color:#fff}

/* Botões e base */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9CED6;background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:#2A313B}
.btn.gold{background:linear-gradient(180deg,#D9AE62,#B98A3E);border-color:#B98A3E;color:#1A1306}
.btn.wa{background:#E8F7EE;border-color:#B7E4C9;color:#13804A}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:.84rem;min-height:34px;border-radius:9px}
.btn svg{width:16px;height:16px}
main{padding-top:22px;padding-bottom:calc(120px + var(--bot))}
.banner{background:#FFF7E6;border:1px solid #F1D49A;border-radius:var(--r);padding:11px 14px;margin-bottom:16px;font-size:.9rem}
.loading{color:var(--muted);padding:48px 0;text-align:center}
h2.sec{font-family:var(--font-display);font-weight:600;font-size:1.3rem;margin:30px 0 12px;letter-spacing:-.01em;text-wrap:balance}
h2.sec:first-child{margin-top:0}
.sub{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel>h3{margin:0 0 12px;font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:8px}
.panel>h3 .count{background:#EEF1F5;color:var(--ink);border-radius:99px;padding:1px 8px;letter-spacing:0;font-size:.74rem}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip.ex{background:#FFF4DC;color:#9A6A0C}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:700;color:var(--muted);font-size:.86rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.empty{background:var(--surface);border:1px dashed var(--accent-line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.empty .btn{margin-top:12px}
.mini-empty{color:var(--muted);font-size:.88rem;margin:0}

/* Etapas: cor por etapa */
[data-etapa="novo"]{--c:#667085}[data-etapa="qualificando"]{--c:#2F7BD8}[data-etapa="qualificado"]{--c:#7559E6}
[data-etapa="visita_agendada"]{--c:#C98A0B}[data-etapa="visitou"]{--c:#DD6B2B}[data-etapa="proposta"]{--c:#A87522}
[data-etapa="fechado"]{--c:#1E9E5A}[data-etapa="perdido"]{--c:#8A94A6}
.stage{background:color-mix(in srgb,var(--c) 11%,#fff);color:var(--c);border-color:color-mix(in srgb,var(--c) 28%,#fff)}
.score{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:99px}
.score.alta{background:#E6F6EC;color:#13804A}.score.media{background:#FFF4DC;color:#9A6A0C}.score.baixa{background:#F0F2F5;color:var(--muted)}

/* Painel */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:20px}
.hello h2{font-family:var(--font-display);font-weight:500;font-size:clamp(1.55rem,4.4vw,2.3rem);margin:0;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
.hello h2 em{color:var(--accent);font-style:italic}
.hello p{margin:5px 0 0;color:var(--muted);font-size:.92rem}
.hero{display:grid;grid-template-columns:280px 1fr;gap:14px}
.hero>*{min-width:0}
.goal{background:linear-gradient(160deg,#151A21,#262D38);color:#fff;border:1px solid #151A21;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .in span{font-size:.78rem;color:#AEB6C2;margin-top:4px}
.goal .t{font-weight:800}
.goal .s{font-size:.82rem;color:#C9A562}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{--c:var(--accent);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 13px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c);opacity:.85}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);margin-bottom:8px}
.kpi .ic svg{width:17px;height:17px}
.kpi .l{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.kpi .v{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1.15;margin-top:2px;color:var(--ink)}
.kpi .h{font-size:.78rem;color:var(--muted);margin-top:2px}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.today>*{min-width:0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
.li:first-child{border-top:0;padding-top:2px}
.li .who{min-width:0;flex:1}
.li .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .who span{display:block;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .when{font-size:.78rem;color:var(--muted);white-space:nowrap;text-align:right}
.li .when.late{color:var(--bad);font-weight:800}
.charts{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.charts>*{min-width:0}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center;font-size:.86rem}
.fstep .bar{height:22px;background:#EEF1F5;border-radius:6px;overflow:hidden}
.fstep .bar i{display:block;height:100%;border-radius:6px;background:var(--c);min-width:3px}
.fstep b{text-align:right}
.fconv{font-size:.72rem;color:var(--muted);padding-left:128px;margin:-2px 0 0}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:120px;height:120px;flex-shrink:0;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .in b{font-size:1.5rem;font-weight:800;line-height:1}
.donut .in span{font-size:.72rem;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.legend span{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;padding-left:12px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;font-size:.84rem;align-items:center}
.hb .lab{display:flex;flex-direction:column;gap:4px;min-width:0}
.hb .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{height:6px;background:#EEF1F5;border-radius:99px;overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.hb b{text-align:right}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;background:var(--surface-2)}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--raised)}
tfoot td{font-weight:800;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0;color:var(--accent)}

/* Leads */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0;min-height:40px}
.filters input{flex:1 1 220px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.lead{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:9px;min-width:0;box-shadow:var(--shadow)}
.lead.t-quente{border-left-color:var(--hot)}.lead.t-morno{border-left-color:var(--warm)}.lead.t-frio{border-left-color:var(--cold)}
.lead .head{display:flex;align-items:flex-start;gap:8px}
.lead .name{font-weight:800;font-size:1.05rem;cursor:pointer;min-width:0;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left}
.lead .meta{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.lead .next{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem}
.lead .next.late{border-color:#F5C2BC;background:#FFF5F4}
.lead .next b{color:var(--accent)}
.lead .next.late b{color:var(--bad)}
.temp{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-left:auto;flex-shrink:0}
.temp button{border:0;background:transparent;padding:5px 9px;font-size:.74rem;font-weight:800;cursor:pointer;color:var(--muted);min-height:30px}
.temp button[data-t="quente"][aria-pressed="true"]{background:var(--hot);color:#fff}
.temp button[data-t="morno"][aria-pressed="true"]{background:var(--warm);color:#fff}
.temp button[data-t="frio"][aria-pressed="true"]{background:var(--cold);color:#fff}
.lead .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lead .foot select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:.84rem;min-width:0;max-width:100%;min-height:36px}

/* Scripts */
.scats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scats::-webkit-scrollbar{display:none}
.scats button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:700;font-size:.86rem;color:var(--muted);white-space:nowrap;cursor:pointer;min-height:36px}
.scats button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.scripts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.scard .cat{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--accent)}
.scard h4{margin:0;font-size:1rem}
.scard p{margin:0;font-size:.88rem;color:#3A4250;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.scard .row{margin-top:auto}

/* Vendas */
.top .gear{padding:9px;border-radius:10px}
.top .gear svg{width:20px;height:20px}
.comis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.pessoa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;min-width:0}
.pessoa img{width:54px;height:54px;border-radius:14px;flex-shrink:0;box-shadow:0 0 0 1px #EAD5AE}
.pessoa .nm{font-weight:800}
.pessoa .rec{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;color:var(--green);line-height:1.1}
.pessoa .sm{font-size:.8rem;color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:10px}
.venda{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:8px 14px;min-width:0}
.venda .t{font-weight:800;overflow-wrap:anywhere}
.venda .m{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.venda .v{text-align:right}
.venda .v b{display:block;font-size:1.15rem}
.venda .partes{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.parte{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;font-size:.84rem;background:var(--surface-2)}
.parte b{font-weight:800}
.parte button{border:0;border-radius:99px;padding:5px 10px;font-weight:800;font-size:.76rem;cursor:pointer;min-height:30px}
.parte button[aria-pressed="false"]{background:#FFF4DC;color:#9A6A0C}
.parte button[aria-pressed="true"]{background:#E6F6EC;color:#13804A}
.calc{grid-column:1/-1;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.88rem;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.calc b{text-align:right}
.calc .tot{font-weight:800;border-top:1px solid var(--line);padding-top:6px}

/* Imóveis */
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.prop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0;box-shadow:var(--shadow);text-align:left}
.prop:hover{border-color:var(--accent-line)}
.prop .price{font-weight:800;font-size:1.35rem;color:var(--ink);letter-spacing:-.02em}
.prop .t{font-weight:800;overflow-wrap:anywhere}
.prop .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.prop .stats b{display:block;font-size:1rem;color:var(--ink)}

/* Diálogo */
dialog{border:1px solid var(--line);padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(16,24,40,.25)}
dialog::backdrop{background:rgba(16,24,40,.45)}
.dlg{display:flex;flex-direction:column;max-height:inherit;min-height:0}
.dlg header{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.2rem;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-weight:700;font-size:.84rem;color:var(--muted);white-space:nowrap;cursor:pointer;min-height:34px}
.dtabs button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.dlg .body{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0}
.pane{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.pane>*{min-width:0}
.pane .full{grid-column:1/-1}
.dlg footer{display:flex;gap:8px;padding:12px 18px calc(12px + var(--bot));border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.f{display:flex;flex-direction:column;gap:5px}
.f label,.flabel{font-size:.76rem;font-weight:800;color:var(--muted);letter-spacing:.02em}
.f input,.f select,.f textarea{border:1px solid #D5DAE1;background:#fff;border-radius:10px;padding:10px 11px;width:100%;min-height:42px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(168,117,34,.15)}
.f textarea{min-height:84px;resize:vertical}
.hint{font-size:.78rem;color:var(--muted)}
.sect{grid-column:1/-1;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--accent);margin-top:4px}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.picks button{border:1px solid #D5DAE1;background:#fff;border-radius:99px;padding:6px 11px;cursor:pointer;font-weight:700;font-size:.84rem;color:var(--muted);min-height:34px}
.picks button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.tempPick{display:flex;gap:6px}
.tempPick button{flex:1;border:1px solid #D5DAE1;background:#fff;border-radius:10px;padding:10px;cursor:pointer;font-weight:800;color:var(--muted);min-height:42px}
.tempPick button[data-t="quente"][aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
.tempPick button[data-t="morno"][aria-pressed="true"]{background:var(--warm);border-color:var(--warm);color:#fff}
.tempPick button[data-t="frio"][aria-pressed="true"]{background:var(--cold);border-color:var(--cold);color:#fff}
.scorebox{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.scorebox .n{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.scorebox .bar{flex:1;height:8px;background:#E3E6EB;border-radius:99px;overflow:hidden}
.scorebox .bar i{display:block;height:100%;border-radius:99px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.timeline li{display:flex;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.88rem;overflow-wrap:anywhere}
.timeline li .dot{margin-top:6px}
.timeline li small{display:block;color:var(--muted);font-size:.74rem}
.addnote{display:grid;grid-template-columns:150px 1fr auto;gap:8px}
.addnote select,.addnote input{border:1px solid #D5DAE1;background:#fff;border-radius:10px;padding:9px 10px;min-width:0;min-height:42px}
.sugg{grid-column:1/-1;background:linear-gradient(160deg,#FFF8EA,#fff 65%);border:1px solid var(--accent-line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sugg .why{font-size:.8rem;color:var(--muted)}
.sugg .why b{color:var(--accent)}
.sugg textarea{border:1px solid #D5DAE1;background:#fff;border-radius:10px;padding:11px;min-height:150px;width:100%;resize:vertical;line-height:1.45}
.cad{grid-column:1/-1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.74rem;font-weight:800;padding:4px 9px;border-radius:99px;background:#E9ECF1;color:var(--muted)}
.steps span.done{background:#E6F6EC;color:#13804A}
.steps span.now{background:var(--primary);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(30px + var(--bot));transform:translateX(-50%);background:var(--primary);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:.9rem;z-index:60;max-width:min(440px,calc(100vw - 32px));text-align:center;line-height:1.35;box-shadow:0 10px 30px rgba(16,24,40,.25)}
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(26px + var(--bot));z-index:25;border-radius:99px;padding:14px 20px;box-shadow:0 10px 26px rgba(16,24,40,.28);min-height:50px}
.settings{display:flex;flex-direction:column;gap:12px}
.auth{max-width:400px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.auth img{width:64px;height:64px;border-radius:16px;box-shadow:0 2px 8px rgba(16,24,40,.12),0 0 0 1px #EAD5AE}
.auth h2{font-family:var(--font-display);font-weight:600;font-size:1.6rem;margin:4px 0 0;letter-spacing:-.02em}
.auth p{margin:0;color:var(--muted);font-size:.92rem}
.auth .err{color:var(--bad);font-weight:700;font-size:.88rem}
.auth .ok{color:var(--good);font-weight:700;font-size:.88rem}
.auth .link{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0;align-self:flex-start}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
input[type="date"],input[type="datetime-local"]{color-scheme:light;-webkit-appearance:none;appearance:none;text-align:left}
input[type="date"]::-webkit-date-and-time-value,input[type="datetime-local"]::-webkit-date-and-time-value{text-align:left}

@media (max-width:980px){

  .goal{flex-direction:row;justify-content:flex-start;text-align:left;gap:16px}
  .ring{width:110px;height:110px}.ring .in b{font-size:1.6rem}
  .today{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
}

  .top .gear{flex:0 0 auto;width:42px;min-height:42px;padding:9px;flex-direction:row}

  .venda .v{text-align:left}
  main{padding-bottom:calc(150px + var(--bot))}

  .toast{bottom:calc(150px + var(--bot))}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .v{font-size:1.35rem}
  .cards,.scripts,.props{grid-template-columns:1fr}
  .pane{grid-template-columns:1fr}
  .addnote{grid-template-columns:1fr 1fr}
  .addnote input{grid-column:1/-1;grid-row:1}

  .fstep{grid-template-columns:96px 1fr 30px}
  .fconv{padding-left:106px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters input{grid-column:1/-1}
  .filters .seg{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr)}
  .filters select,.filters .btn{width:100%;min-width:0}
  .lead .foot select{flex:1 1 100%}
  .lead .foot .spacer{display:none}
  .lead .foot .btn{flex:1}
  .lead .foot .btn.wa{flex:0 0 52px}
  .lead .head{flex-wrap:wrap}
  .fab{width:58px;height:58px;padding:0;font-size:0;border-radius:50%}
  .fab::before{content:"+";font-size:2rem;font-weight:500;line-height:1}
  /* iPhone: campos com 16px não dão zoom ao tocar */
  input,select,textarea{font-size:16px!important}
  .seg button{padding:8px 10px}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}

/* ---------- Pontuação do lead (0–100) ---------- */
function pontuacao(l){
  let p=0;
  p+={"Imediato (até 30 dias)":25,"1 a 3 meses":18,"3 a 6 meses":10,"Mais de 6 meses":4}[l.prazo]||0;
  const cr={"Aprovado":25,"Em análise":15,"Simulação feita":12}[l.credito];
  if(cr)p+=cr; else if(l.credito!=="Reprovado")p+={"À vista":22,"MCMV Faixa 3":8,"MCMV Faixa 4":8,"Financiamento bancário":8,"FGTS + financiamento":10,"Permuta":6}[l.pagamento]||0;
  p+={qualificado:10,visita_agendada:18,visitou:22,proposta:28,fechado:30}[l.etapa]||0;
  const u=diasDesde(l.ultimoContato||l.entrada); if(l.ultimoContato||l.entrada)p+=u<=2?10:u<=7?5:0;
  if(l.faixaMax||l.orcamento)p+=4; if(l.decisores)p+=3; if(l.motivoCompra)p+=3;
  if(l.etapa==="perdido")p=Math.round(p*.4);
  return Math.max(0,Math.min(100,p));
}
const nivel=s=>s>=70?["alta","Alta"]:s>=40?["media","Média"]:["baixa","Baixa"];

function preencher(texto,l){
  const i=l?imovelDe(l.imovelId):null;
  return String(texto||"")
    .replace(/\{nome\}/g,l?primeiroNome(l.nome)||"":"[nome]")
    .replace(/\{nomeCompleto\}/g,l?l.nome||"":"")

    .replace(/\{bairro\}/g,i&&i.bairro?i.bairro:"Rio Claro")
    .replace(/\{valor\}/g,i&&i.valor?brl0(i.valor):"")
    .replace(/\{visita\}/g,l&&l.visita?fmtVisita(l.visita):"[dia e hora]")

function cadInfo(l){
  if(!l||!l.cadencia||!CADENCIAS[l.cadencia.tipo])return null;
  const c=CADENCIAS[l.cadencia.tipo],p=l.cadencia.passo||0;
  if(p>=c.passos.length)return{c,p,fim:true};
  const s=c.passos[p];
  return{c,p,fim:false,due:addDias(l.cadencia.inicio,s[0]),scriptId:s[1],rotulo:s[2]};
}
function sugestao(l){
  const ci=cadInfo(l);
  if(ci&&!ci.fim)return{id:ci.scriptId,why:"Cadência <b>"+ci.c.nome+"</b> · passo <b>"+ci.rotulo+"</b>"};
  if(l.etapa==="perdido"||l.temperatura==="frio"){
    const m={"Crédito negado":"re-credito","Achou caro":"re-opcoes","Não gostou do imóvel":"re-opcoes","Adiou a compra":"re-sumiu","Parou de responder":"re-sumiu"}[l.motivoEsfriou];
    if((l.maiorEtapa||0)>=4)return{id:"re-visitou",why:"Lead frio que <b>já visitou</b>"};
    return{id:m||"re-sumiu",why:"Lead frio"+(l.motivoEsfriou?" · motivo: <b>"+esc(l.motivoEsfriou)+"</b>":"")};
  }
  const porEtapa={novo:["ab-humana","Lead novo · abrir conversa"],qualificando:[!l.prazo?"q-prazo":!l.pagamento?"q-pagamento":!(l.orcamento||l.faixaMax)?"q-orcamento":!l.decisores?"q-decisor":"ag-visita","Em qualificação · próxima pergunta"],qualificado:["ag-visita","Qualificado · hora de agendar"],visita_agendada:["ag-confirma","Visita marcada · confirmar"],visitou:["pv-dia","Visitou · pós-visita"],proposta:["pv-proposta","Proposta · acompanhar"],fechado:["re-visitou","Venda fechada · pedir indicação"]};
  const e=porEtapa[l.etapa]||porEtapa.novo;
  return{id:e[0],why:e[1].replace(/·/,"·")};
}

const cacheKey=()=>LS_KEY+"-cache-"+(donoId||(sessao?sessao.user.id:""));
function loadCache(){try{const raw=localStorage.getItem(cacheKey());if(raw){const d=JSON.parse(raw);state.leads=d.leads||[];state.imoveis=d.imoveis||[];state.gastos=d.gastos||[];state.vendas=d.vendas||[];state.config=d.config||{};state.scripts=d.scripts||null}}catch(e){}}

function removeLocal(id){["leads","imoveis","gastos","vendas"].forEach(c=>{state[c]=state[c].filter(x=>x.id!==id)})}
function aplicarLinha(r){
  if(!r||!r.id)return;
  if(r.colecao==="config"){if(r.id==="scripts")state.scripts=(r.dados&&r.dados.itens)||null;else state.config=Object.assign({},r.dados||{});return}
  if(!Array.isArray(state[r.colecao]))return;
  removeLocal(r.id); state[r.colecao].push(Object.assign({},r.dados||{},{id:r.id}));
}
function setSync(t){const el=$("#syncInfo");if(el)el.textContent=t}
async function buscarTudo(){
  const linhas=[]; let de=0;
  while(true){
    const {data,error}=await sb.from("registros").select("id,colecao,dados").eq("user_id",donoId).range(de,de+999);
    if(error){setSync("Sem conexão · última cópia");return}
    linhas.push(...data); if(data.length<1000)break; de+=1000;
  }
  const temLocal=state.leads.length+state.imoveis.length+state.gastos.length+state.vendas.length>0;
  if(!linhas.some(r=>r.colecao!=="config")&&temLocal){
    setSync("Servidor sem dados · cópia do aparelho mantida");
    toast("Não encontrei seus dados no servidor. Mantive a cópia deste aparelho: baixe um backup em Ajustes.");
    linhas.filter(r=>r.colecao==="config").forEach(aplicarLinha); saveCache(); if(!dlg.open)render(); return;
  }
  state.leads=[];state.imoveis=[];state.gastos=[];state.vendas=[];state.config={};state.scripts=null;
  linhas.forEach(aplicarLinha); saveCache(); setSync("Sincronizado"); if(!dlg.open)render();
}
function assinar(){
  if(canal){sb.removeChannel(canal);canal=null}
  canal=sb.channel("registros-"+sessao.user.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"registros"},p=>{
      if(p.eventType==="DELETE"){if(!p.old||!p.old.user_id||p.old.user_id===donoId)removeLocal(p.old&&p.old.id)}else{if(p.new&&p.new.user_id!==donoId)return;aplicarLinha(p.new)}
      saveCache(); if(!dlg.open)render();
    }).subscribe();
}

/* ---------- Métricas ---------- */
function noPeriodo(dataStr){if(periodo==="todos")return true;if(!dataStr)return false;return diasDesde(dataStr)<Number(periodo)}
function metricas(imovelId){
  const gastos=state.gastos.filter(g=>noPeriodo(g.data)&&(!imovelId||g.imovelId===imovelId));
  const leads=state.leads.filter(l=>noPeriodo(l.entrada)&&(!imovelId||l.imovelId===imovelId));
  const gasto=gastos.reduce((s,g)=>s+(Number(g.valor)||0),0);
  const leadsMeta=gastos.reduce((s,g)=>s+(Number(g.leads)||0),0);
  const alcan=l=>Math.max(l.maiorEtapa||0,l.etapa==="perdido"?0:(ETAPA_IDX[l.etapa]??0));
  const qualif=leads.filter(l=>alcan(l)>=2).length;
  const visitas=leads.filter(l=>alcan(l)>=3).length;
  const visitou=leads.filter(l=>alcan(l)>=4).length;
  const vendas=leads.filter(l=>l.etapa==="fechado").length;
  const quentes=leads.filter(l=>l.temperatura==="quente"&&ativo(l)).length;
  return{gasto,leadsMeta,leads,nLeads:leads.length,qualif,visitas,visitou,vendas,quentes,alcan,
    cpl:leadsMeta?gasto/leadsMeta:NaN,cpq:qualif?gasto/qualif:NaN,cpv:vendas?gasto/vendas:NaN};
}

function filtrarLeads(){
  const b=fBusca.trim().toLowerCase(); const t=hoje();
  const out=state.leads.filter(l=>{
    if(fTemp!=="todos"&&l.temperatura!==fTemp)return false;
    if(fEtapa==="ativos"&&!ativo(l))return false;
    if(fEtapa==="cadencia"&&!(cadInfo(l)&&!cadInfo(l).fim))return false;
    if(!["ativos","todas","cadencia"].includes(fEtapa)&&l.etapa!==fEtapa)return false;
    if(fImovel!=="todos"&&l.imovelId!==fImovel)return false;
    if(fRetorno){const ci=cadInfo(l);const due=ci&&!ci.fim?ci.due:l.proximoContato;if(!(due&&due<=t))return false}
    if(b&&!([l.nome,l.telefone,l.obs,l.email,l.bairrosInteresse,l.moraEm].join(" ")).toLowerCase().includes(b))return false;
    return true;
  });
  const o={quente:0,morno:1,frio:2};
  const proximo=l=>{const ci=cadInfo(l);return(ci&&!ci.fim?ci.due:l.proximoContato)||"9999"};
  const sorts={quentes:(a,b)=>(o[a.temperatura]??3)-(o[b.temperatura]??3)||pontuacao(b)-pontuacao(a),pontuacao:(a,b)=>pontuacao(b)-pontuacao(a),recentes:(a,b)=>(b.criadoEm||0)-(a.criadoEm||0),proximo:(a,b)=>proximo(a).localeCompare(proximo(b))};
  return out.sort(sorts[fOrdem]||sorts.quentes);
}

  const fb=$("#fBusca"); if(fb){fb.oninput=()=>{fBusca=fb.value;const pos=fb.selectionStart;render();const n=$("#fBusca");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}

  const imp=$("#impFile"); if(imp)imp.onchange=()=>{if(imp.files&&imp.files[0])importarBackup(imp.files[0]);imp.value=""};

function aplicarEtapa(rec,nova,antiga){
  rec.etapa=nova;
  if(nova!=="perdido")rec.maiorEtapa=Math.max(rec.maiorEtapa||0,ETAPA_IDX[nova]??0);
  else rec.maiorEtapa=Math.max(rec.maiorEtapa||0,ETAPA_IDX[antiga]??0);
  if(nova==="fechado"&&antiga!=="fechado")rec.fechadoEm=hoje();
  if(nova==="perdido"&&rec.temperatura!=="frio")rec.temperatura="frio";
  return rec;
}
function armar(btn,texto,fn){
  if(btn.dataset.armed){delete btn.dataset.armed;fn();return}
  const orig=btn.textContent;btn.dataset.armed="1";btn.classList.add("armed");btn.textContent=texto;
  setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.classList.remove("armed");btn.textContent=orig}},4000);
}
async function acao(a,btn){
  if(a==="novoLead")abrirLead();
  else if(a==="novoImovel")abrirImovel();
  else if(a==="novoGasto")abrirGasto();
  else if(a==="fRetorno"){fRetorno=!fRetorno;render()}
  else if(a==="exportar")exportarCSV();
  else if(a==="exportarVendas")exportarVendas();
  else if(a==="novaVenda")abrirVenda();
  else if(a==="backup")baixarBackup();
  else if(a==="sair"){await sb.auth.signOut();try{localStorage.removeItem(cacheKey())}catch(e){}}
  else if(a==="salvarMeta"){const v=Number($("#cfgMeta").value);if(v>0){await salvarConfig({metaVendas:v});toast("Meta salva: "+v+" vendas")}}
  else if(a==="resetScripts")armar(btn,"Confirmar: restaurar padrão",async()=>{try{await salvarScripts(SCRIPTS_PADRAO.map(s=>Object.assign({},s)));toast("Scripts restaurados");render()}catch(e){}});
  else if(a==="metaSync"){
    btn.disabled=true; btn.textContent="Buscando no Meta…";
    try{
      const {data,error}=await sb.functions.invoke("meta-sync",{body:{dias:7}});
      if(error){let msg=error.message||"erro";try{const j=await error.context.json();if(j&&j.erro)msg=j.erro}catch(e){}
        toast(/not found|404|Failed to send/i.test(msg)?"A sincronização com o Meta não está instalada no Supabase.":"Não atualizou: "+msg)}
      else{toast(data&&data.mensagem?data.mensagem:"Atualizado");await buscarTudo()}
    }finally{if(btn.isConnected){btn.disabled=false;btn.textContent="Atualizar do Meta agora"}}
  }
}

/* ---------- Vendas ---------- */
const PCT_IMOB=6, PCT_CORRETOR=32;
function corretores(){const n=[...new Set(equipe.map(r=>r.nome).filter(Boolean))];return n.length>=2?n:["João Matheus","Pablo Rodrigues"]}
const logoDe=n=>LOGOS[String(n).toLowerCase()]||"logo-mark.png";
function comissao(v){return (Number(v.valor)||0)*(Number(v.pctImob??PCT_IMOB)||0)/100*(Number(v.pctCorretor??PCT_CORRETOR)||0)/100}
function divisaoDe(v){const cs=corretores();if(v.divisao&&typeof v.divisao==="object"&&Object.keys(v.divisao).length)return v.divisao;const d={};cs.forEach(n=>d[n]=100/cs.length);return d}
function partes(v){const c=comissao(v),d=divisaoDe(v);return Object.entries(d).filter(([,p])=>p>0).map(([n,p])=>({nome:n,pct:p,valor:c*p/100,recebido:!!(v.recebido&&v.recebido[n])}))}
function noPeriodoVenda(v){const dt=v.data||"";const t=hoje();if(vPeriodo==="mes")return dt.slice(0,7)===t.slice(0,7);if(vPeriodo==="ano")return dt.slice(0,4)===t.slice(0,4);return true}
function vVendas(){
  const vs=state.vendas.filter(noPeriodoVenda).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const total=vs.reduce((s,v)=>s+(Number(v.valor)||0),0), comTot=vs.reduce((s,v)=>s+comissao(v),0);
  const cs=corretores(); const por={}; cs.forEach(n=>por[n]={receber:0,recebido:0});
  vs.forEach(v=>partes(v).forEach(p=>{por[p.nome]=por[p.nome]||{receber:0,recebido:0};por[p.nome][p.recebido?"recebido":"receber"]+=p.valor}));
  const per=[["mes","Este mês"],["ano","Este ano"],["tudo","Tudo"]];
  let h='<div class="row" style="margin-bottom:12px"><h2 class="sec" style="margin:0">Vendas</h2><span class="spacer"></span><div class="seg" role="group" aria-label="Período">'+per.map(p=>'<button type="button" data-vper="'+p[0]+'" aria-pressed="'+(vPeriodo===p[0])+'">'+p[1]+'</button>').join("")+'</div></div>';
  h+='<div class="kpis">'+
    kpi("var(--green)","check","Total vendido",brl0(total),vs.length+(vs.length===1?" venda":" vendas"))+
    kpi("var(--accent)","money","Comissão dos corretores",brl0(comTot),PCT_CORRETOR+"% de "+PCT_IMOB+"% do valor")+
    kpi("var(--teal)","target","A receber",brl0(Object.values(por).reduce((s,x)=>s+x.receber,0)),"somando os dois")+
  '</div>';
  h+='<div class="comis">'+Object.entries(por).map(([n,x])=>'<div class="pessoa"><img src="'+logoDe(n)+'" alt=""><div style="min-width:0"><div class="nm">'+esc(n)+'</div><div class="sm">tem a receber</div><div class="rec">'+brl(x.receber)+'</div><div class="sm">Já recebeu '+brl(x.recebido)+'</div></div></div>').join("")+'</div>';
  const semVenda=state.leads.filter(l=>l.etapa==="fechado"&&!state.vendas.some(v=>v.leadId===l.id));
  if(semVenda.length)h+='<div class="banner" style="margin-top:16px"><b>'+semVenda.length+(semVenda.length>1?" leads fechados ainda sem venda registrada":" lead fechado ainda sem venda registrada")+':</b> '+semVenda.slice(0,6).map(l=>'<button type="button" class="btn sm" style="margin:4px 4px 0 0" data-venda-lead="'+esc(l.id)+'">Registrar · '+esc(l.nome||"lead")+'</button>').join("")+'</div>';
  h+='<div class="row" style="margin:24px 0 12px"><h2 class="sec" style="margin:0">Vendas registradas</h2><span class="spacer"></span>'+(state.vendas.length?'<button class="btn sm" type="button" data-act="exportarVendas">Exportar CSV</button>':'')+'</div>';
  if(!state.vendas.length)return h+'<div class="empty"><b>Nenhuma venda registrada ainda</b>Registre cada venda com o valor e o CRM calcula a comissão de cada um.<br><button class="btn primary" type="button" data-act="novaVenda">Registrar venda</button></div>';
  if(!vs.length)return h+'<div class="empty"><b>Nenhuma venda neste período</b>Escolha "Tudo" para ver todas.</div>';
  h+='<div class="vlist">'+vs.map(v=>{const c=comissao(v);const i=imovelDe(v.imovelId);
    return'<article class="venda"><div style="min-width:0"><button type="button" class="t" style="background:none;border:0;padding:0;text-align:left;cursor:pointer" data-edit-venda="'+esc(v.id)+'">'+esc(v.cliente||"Cliente")+'</button><div class="m">'+fmtData(v.data)+' · '+esc(i?i.titulo:(v.imovelDesc||"Outro imóvel"))+'</div></div>'+
    '<div class="v"><span class="sub">Venda '+brl0(v.valor)+'</span><b>'+brl(c)+'</b><span class="sub">comissão</span></div>'+
    '<div class="partes">'+partes(v).map(p=>'<span class="parte">'+esc(primeiroNome(p.nome))+' <b>'+brl(p.valor)+'</b><button type="button" data-receber="'+esc(v.id)+'" data-quem="'+esc(p.nome)+'" aria-pressed="'+p.recebido+'">'+(p.recebido?"✓ Recebido":"A receber")+'</button></span>').join("")+'</div></article>'}).join("")+'</div>';
  return h;
}
function abrirVenda(id,leadId){
  const v=id?state.vendas.find(x=>x.id===id):null; const cs=corretores();
  const lead=leadId?state.leads.find(l=>l.id===leadId):null;
  const im=lead?imovelDe(lead.imovelId):null;
  const d=v?JSON.parse(JSON.stringify(v)):{data:hoje(),leadId:lead?lead.id:"",cliente:lead?lead.nome:"",imovelId:lead?lead.imovelId:"",valor:im?im.valor:"",pctImob:PCT_IMOB,pctCorretor:PCT_CORRETOR,divisao:null,recebido:{}};
  const div=divisaoDe(d); const divKey=Object.keys(div).length===cs.length&&cs.every(n=>Math.abs((div[n]||0)-100/cs.length)<.01)?"igual":(cs.find(n=>div[n]===100)||"igual");
  const leadsOpts=state.leads.slice().sort((a,b)=>(a.etapa==="fechado"?0:1)-(b.etapa==="fechado"?0:1)||String(a.nome).localeCompare(String(b.nome))).map(l=>[l.id,(l.nome||"Sem nome")+(l.etapa==="fechado"?" · fechado":"")]);
  const corpo='<div class="pane">'+
    F("vLead","Cliente (lead)",S("vLead",leadsOpts,d.leadId,"Não está no CRM"))+F("vCliente","Nome do cliente",I("vCliente",d.cliente,"text",'autocapitalize="words"'))+
    F("vImovel","Imóvel",S("vImovel",state.imoveis.map(i=>[i.id,i.titulo]),d.imovelId,"Outro imóvel"))+F("vImovelDesc","Descrição (se for outro imóvel)",I("vImovelDesc",d.imovelDesc,"text",'placeholder="Ex.: casa Vila Paulista"'))+
    F("vData","Data da venda",I("vData",d.data,"date"))+F("vValor","Valor da venda (R$)",I("vValor",d.valor,"number",'inputmode="decimal" min="0" placeholder="300000"'))+
    F("vDiv","Divisão da comissão",S("vDiv",[["igual","Metade para cada"]].concat(cs.map(n=>[n,"100% "+n])),divKey),true)+
    '<div class="calc" id="vCalc"></div>'+
    F("vPctImob","Comissão da imobiliária (%)",I("vPctImob",d.pctImob??PCT_IMOB,"number",'inputmode="decimal" min="0" step="0.1"'))+F("vPctCor","Parte dos corretores (%)",I("vPctCor",d.pctCorretor??PCT_CORRETOR,"number",'inputmode="decimal" min="0" step="0.1"'))+
    F("vObs","Observações",T("vObs",d.obs,"Ex.: comissão paga em 2 parcelas"),true)+'</div>';
  abrirDialogo({titulo:v?"Editar venda":"Registrar venda",corpo,salvarTxt:v?"Salvar":"Registrar venda",onSave:async()=>{
    const r=lerVenda(); if(!r.valor){toast("Informe o valor da venda");$("#vValor").focus();return false}
    if(!r.cliente){toast("Informe o nome do cliente");$("#vCliente").focus();return false}
    await salvar("vendas",r); toast(v?"Venda atualizada":"Venda registrada");
    if(r.leadId){const l=state.leads.find(x=>x.id===r.leadId);if(l&&l.etapa!=="fechado"){try{await salvar("leads",aplicarEtapa(Object.assign({},l,{alteradoPor:eu()}),"fechado",l.etapa),{silencioso:true})}catch(e){}}}
  },onDelete:v?()=>apagar("vendas",v.id):null});
  function lerVenda(){
    const num=id=>Number(String(val(id)).replace(",","."))||0;
    const k=val("vDiv"); const dv={}; cs.forEach(n=>dv[n]=k==="igual"?100/cs.length:(n===k?100:0));
    const recebido={}; cs.forEach(n=>{if(d.recebido&&d.recebido[n]&&dv[n]>0)recebido[n]=true});
    return Object.assign({},d,{leadId:val("vLead"),cliente:val("vCliente"),imovelId:val("vImovel"),imovelDesc:val("vImovelDesc"),data:val("vData")||hoje(),valor:num("vValor"),pctImob:num("vPctImob"),pctCorretor:num("vPctCor"),divisao:dv,recebido,obs:val("vObs"),criadoPor:d.criadoPor||(v?"":eu()),alteradoPor:eu()});
  }
  const calc=()=>{const r=lerVenda();const c=comissao(r);const ps=partes(r);
    $("#vCalc").innerHTML='<span>Imobiliária ('+(r.pctImob||0)+'% de '+brl0(r.valor)+')</span><b>'+brl((r.valor||0)*(r.pctImob||0)/100)+'</b><span>Corretores ('+(r.pctCorretor||0)+'%)</span><b>'+brl(c)+'</b>'+ps.map(p=>'<span class="tot">'+esc(p.nome)+'</span><b class="tot">'+brl(p.valor)+'</b>').join("")};
  ["vValor","vPctImob","vPctCor","vDiv"].forEach(i=>{const e=document.getElementById(i);e.oninput=calc;e.onchange=calc});
  $("#vLead").onchange=()=>{const l=state.leads.find(x=>x.id===val("vLead"));if(l){if(!val("vCliente"))$("#vCliente").value=l.nome||"";if(l.imovelId){$("#vImovel").value=l.imovelId;const i=imovelDe(l.imovelId);if(i&&!val("vValor"))$("#vValor").value=i.valor||""}}calc()};
  $("#vImovel").onchange=()=>{const i=imovelDe(val("vImovel"));if(i&&!val("vValor"))$("#vValor").value=i.valor||"";calc()};
  calc();
}
function exportarVendas(){
  const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"'; const cs=corretores();
  const cab=["Data","Cliente","Imóvel","Valor da venda","Comissão imobiliária %","Corretores %","Comissão corretores"].concat(cs.flatMap(n=>[n,n+" recebido?"]));
  const linhas=[cab.map(q).join(";")].concat(state.vendas.map(v=>{const ps=partes(v);const i=imovelDe(v.imovelId);return[v.data,v.cliente,i?i.titulo:v.imovelDesc,v.valor,v.pctImob,v.pctCorretor,comissao(v).toFixed(2)].concat(cs.flatMap(n=>{const p=ps.find(x=>x.nome===n);return[p?p.valor.toFixed(2):"0",p&&p.recebido?"Sim":"Não"]})).map(q).join(";")}));
  baixar("vendas-"+hoje()+".csv","﻿"+linhas.join("\r\n"),"text/csv;charset=utf-8"); toast("Planilha de vendas baixada");
}

/* ---------- Imóvel ---------- */
function abrirImovel(id){
  const i=id?state.imoveis.find(x=>x.id===id):null; const d=i?Object.assign({},i):{status:"Anunciando",tipo:"Apartamento"};
  const corpo='<div class="pane">'+
    F("iTit","Nome do imóvel",I("iTit",d.titulo,"text",'required placeholder="Ex.: Apto 2q Jardim Itapuã"'),true)+
    F("iCodigo","Código nos anúncios do Meta",I("iCodigo",d.codigo,"text",'placeholder="Ex.: ITAPUA" autocapitalize="characters"'))+
    F("iValor","Valor (R$)",I("iValor",d.valor,"number",'inputmode="numeric" min="0" step="1000" placeholder="280000"'))+
    '<p class="hint full" style="margin:0">Coloque o código entre colchetes no nome da campanha no Meta, ex.: <b style="color:var(--accent)">Teste criativo [ITAPUA]</b>.</p>'+
    F("iStatus","Status",S("iStatus",STATUS_IMOVEL,d.status))+F("iTipo","Tipo",S("iTipo",TIPOS,d.tipo))+
    F("iBairro","Bairro",I("iBairro",d.bairro,"text",'placeholder="Ex.: Vila Cristina"'))+F("iQuartos","Quartos",I("iQuartos",d.quartos,"number",'inputmode="numeric" min="0"'))+
    F("iArea","Área (m²)",I("iArea",d.area,"number",'inputmode="numeric" min="0"'))+F("iVagas","Vagas",I("iVagas",d.vagas,"number",'inputmode="numeric" min="0"'))+
    F("iLink","Link do anúncio ou fotos",I("iLink",d.link,"url",'inputmode="url" placeholder="https://"'),true)+
    F("iObs","Observações",T("iObs",d.obs,"Condições, aceita MCMV, documentação…"),true)+'</div>';
  abrirDialogo({titulo:i?"Editar imóvel":"Novo imóvel",corpo,onSave:async()=>{
    const titulo=val("iTit"); if(!titulo){toast("Dê um nome ao imóvel");return false}
    await salvar("imoveis",Object.assign({},d,{titulo,valor:Number(val("iValor"))||0,status:val("iStatus"),tipo:val("iTipo"),bairro:val("iBairro"),quartos:val("iQuartos"),area:val("iArea"),vagas:val("iVagas"),link:val("iLink"),obs:val("iObs"),codigo:val("iCodigo").toUpperCase().replace(/[\[\]\s]/g,"")}));
    toast(i?"Imóvel atualizado":"Imóvel cadastrado");
  },onDelete:i?()=>apagar("imoveis",i.id):null});
}

/* ---------- Gasto ---------- */
function abrirGasto(id){
  const g=id?state.gastos.find(x=>x.id===id):null;
  const ult=[...state.gastos].filter(x=>x.origem!=="meta").sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0))[0]||{};
  const d=g?Object.assign({},g):{data:hoje(),imovelId:ult.imovelId||(state.imoveis[0]||{}).id||"",campanha:ult.campanha||""};
  const corpo='<div class="pane">'+(d.origem==="meta"?'<div class="banner full" style="margin:0">Este lançamento veio do Meta. Se você editar, a próxima sincronização vai sobrescrever.</div>':'')+
    F("gData","Data",I("gData",d.data,"date"))+F("gImovel","Imóvel",S("gImovel",state.imoveis.map(i=>[i.id,i.titulo]),d.imovelId,"Sem imóvel"))+
    F("gCamp","Campanha / anúncio",I("gCamp",d.campanha,"text",'placeholder="Ex.: Impulsionamento Instagram"'),true)+
    F("gValor","Valor gasto (R$)",I("gValor",d.valor,"number",'inputmode="decimal" min="0" step="0.01"'))+F("gLeads","Leads que chegaram",I("gLeads",d.leads,"number",'inputmode="numeric" min="0"'))+
    '<p class="hint full" id="gCpl" style="margin:0"></p>'+F("gObs","Observação",T("gObs",d.obs,""),true)+'</div>';
  abrirDialogo({titulo:g?"Editar lançamento":"Lançar gasto",corpo,onSave:async()=>{
    await salvar("gastos",Object.assign({},d,{data:val("gData")||hoje(),imovelId:val("gImovel"),campanha:val("gCamp"),valor:Number(String(val("gValor")).replace(",","."))||0,leads:Number(val("gLeads"))||0,obs:val("gObs")}));
    toast(g?"Lançamento atualizado":"Gasto lançado");
  },onDelete:g?()=>apagar("gastos",g.id):null});
  const upd=()=>{const v=Number(val("gValor"))||0,n=Number(val("gLeads"))||0;$("#gCpl").textContent=n?"Custo por lead: "+brl(v/n):""};
  $("#gValor").oninput=upd;$("#gLeads").oninput=upd;upd();
}

/* ---------- Exportar / backup ---------- */
function baixar(nome,conteudo,tipo){
  const blob=new Blob([conteudo],{type:tipo}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function exportarCSV(){
  const cols=[["nome","Nome"],["telefone","Telefone"],["email","E-mail"],["temperatura","Temperatura"],["etapa","Etapa"],["pontuacao","Pontuação"],["imovel","Imóvel"],["origem","Origem"],["entrada","Entrada"],["prazo","Prazo"],["pagamento","Pagamento"],["credito","Crédito"],["rendaFamiliar","Renda"],["faixaMax","Preço máx."],["bairrosInteresse","Bairros"],["motivoCompra","Motivo"],["objecoes","Objeções"],["motivoEsfriou","Esfriou por"],["gatilhoVolta","Volta se"],["proximoContato","Próximo contato"],["visita","Visita"],["obs","Observações"]];
  const q=v=>'"'+String(Array.isArray(v)?v.join(", "):v??"").replace(/"/g,'""')+'"';
  const linhas=[cols.map(c=>q(c[1])).join(";")].concat(state.leads.map(l=>cols.map(c=>q(c[0]==="imovel"?imovelNome(l.imovelId):c[0]==="etapa"?ETAPA_NOME[l.etapa]:c[0]==="pontuacao"?pontuacao(l):l[c[0]])).join(";")));
  baixar("leads-"+hoje()+".csv","﻿"+linhas.join("\r\n"),"text/csv;charset=utf-8");
  toast("Planilha baixada");
}
async function baixarBackup(){
  const dados={app:"carteira-joao-matheus",versao:2,geradoEm:new Date().toISOString(),leads:state.leads,imoveis:state.imoveis,gastos:state.gastos,vendas:state.vendas,config:state.config,scripts:state.scripts};
  baixar("backup-carteira-jm-"+hoje()+".json",JSON.stringify(dados,null,2),"application/json");
  await salvarConfig({ultimoBackup:hoje()});
  toast("Backup baixado");
}
async function importarBackup(file){
  let d; try{d=JSON.parse(await file.text())}catch(e){toast("Arquivo inválido. Escolha um backup .json do CRM.");return}
  if(!d||!Array.isArray(d.leads)||!Array.isArray(d.imoveis)||!Array.isArray(d.gastos)){toast("Esse arquivo não é um backup do CRM.");return}
  const agora=new Date().toISOString(); const rows=[];
  for(const c of["leads","imoveis","gastos","vendas"])for(const x of (d[c]||[])){if(!x||!x.id)continue;const body=Object.assign({},x);delete body.id;rows.push({user_id:donoId,id:String(x.id),colecao:c,dados:body,atualizado_em:agora})}
  if(d.config&&typeof d.config==="object")rows.push({user_id:donoId,id:"config",colecao:"config",dados:d.config,atualizado_em:agora});
  if(Array.isArray(d.scripts))rows.push({user_id:donoId,id:"scripts",colecao:"config",dados:{itens:d.scripts},atualizado_em:agora});
  toast("Restaurando "+rows.length+" registros…");
  for(let i=0;i<rows.length;i+=200){const {error}=await sb.from("registros").upsert(rows.slice(i,i+200),{onConflict:"user_id,id"});if(error){toast("Parou no meio: "+error.message);return}}
  await buscarTudo(); toast("Backup restaurado: "+rows.length+" registros");
}

/* ---------- Navegação ---------- */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{view=t.dataset.view;try{localStorage.setItem(LS_KEY+"-view",view)}catch(e){}render();window.scrollTo(0,0)});
$("#fab").onclick=()=>{if(view==="vendas")abrirVenda();else if(view==="imoveis")abrirImovel();else if(view==="gastos")abrirGasto();else if(view==="scripts")abrirScript();else abrirLead()};
try{const v=localStorage.getItem(LS_KEY+"-view");if(v&&["painel","leads","vendas","scripts","imoveis","gastos","ajustes"].includes(v))view=v}catch(e){}
init();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
})();
