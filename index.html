
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A09">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carteira JM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Carteira João Matheus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Mesa escura do corretor: latão como cor de marca; cada indicador com sua cor; temperatura e etapas com cores semânticas. */
:root{
  color-scheme:dark;
  --bg:#0B0A09; --surface:#171513; --surface-2:#211D18; --raised:#2B251D; --ink:#F6F1E8; --muted:#B7AA97; --line:#40372B;
  --accent:#E4B84E; --accent-ink:#17110A; --accent-soft:#302515; --accent-line:#735821;
  --primary:#DDAF42; --primary-ink:#17110A;
  --hot:#E97862; --warm:#E6B84F; --cold:#78A9E8;
  --teal:#6DAE9C; --violet:#B39AE8; --blue:#78A9E8; --orange:#D99A55; --green:#57BD83; --rose:#E97862; --slate:#9D958A;
  --good:#57BD83; --bad:#E97862;
  --shadow:0 2px 8px rgba(0,0,0,.22),0 10px 28px rgba(0,0,0,.22);
  --font-display:"Fraunces","Iowan Old Style","Georgia",serif;
  --font-body:"Manrope",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --r:14px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;
  background:radial-gradient(900px 380px at 92% -10%,rgba(214,170,92,.12),transparent 60%),var(--bg);
  min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

/* Cabeçalho */
header.top{position:sticky;top:0;z-index:20;padding-top:var(--top);background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
img.mono{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:block;box-shadow:0 2px 8px rgba(16,24,40,.12),0 0 0 1px #EAD5AE}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--font-display);font-weight:600;font-size:1.35rem;margin:0;letter-spacing:-.015em;line-height:1.1;white-space:nowrap}
.brand .role{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700;white-space:nowrap}
.brand .sync{font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
nav.tabs{display:flex;gap:2px}
.tab{border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px;font-size:.92rem}
.tab:hover{color:var(--ink)}
.tab svg{width:18px;height:18px;flex-shrink:0}
.tab[aria-current="page"]{background:var(--primary);color:#fff}

/* Botões e base */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9CED6;background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:#2A313B}
.btn.gold{background:linear-gradient(180deg,#D9AE62,#B98A3E);border-color:#B98A3E;color:#1A1306}
.btn.wa{background:#E8F7EE;border-color:#B7E4C9;color:#13804A}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:.84rem;min-height:34px;border-radius:9px}
.btn svg{width:16px;height:16px}
main{padding-top:22px;padding-bottom:calc(120px + var(--bot))}
.banner{background:#FFF7E6;border:1px solid #F1D49A;border-radius:var(--r);padding:11px 14px;margin-bottom:16px;font-size:.9rem}
.loading{color:var(--muted);padding:48px 0;text-align:center}
h2.sec{font-family:var(--font-display);font-weight:600;font-size:1.3rem;margin:30px 0 12px;letter-spacing:-.01em;text-wrap:balance}
h2.sec:first-child{margin-top:0}
.sub{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel>h3{margin:0 0 12px;font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:8px}
.panel>h3 .count{background:#EEF1F5;color:var(--ink);border-radius:99px;padding:1px 8px;letter-spacing:0;font-size:.74rem}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip.ex{background:#FFF4DC;color:#9A6A0C}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:700;color:var(--muted);font-size:.86rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.empty{background:var(--surface);border:1px dashed var(--accent-line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.empty .btn{margin-top:12px}
.mini-empty{color:var(--muted);font-size:.88rem;margin:0}

/* Etapas: cor por etapa */
[data-etapa="novo"]{--c:#667085}[data-etapa="qualificando"]{--c:#2F7BD8}[data-etapa="qualificado"]{--c:#7559E6}
[data-etapa="visita_agendada"]{--c:#C98A0B}[data-etapa="visitou"]{--c:#DD6B2B}[data-etapa="proposta"]{--c:#A87522}
[data-etapa="fechado"]{--c:#1E9E5A}[data-etapa="perdido"]{--c:#8A94A6}
.stage{background:color-mix(in srgb,var(--c) 11%,#fff);color:var(--c);border-color:color-mix(in srgb,var(--c) 28%,#fff)}
.score{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:99px}
.score.alta{background:#E6F6EC;color:#13804A}.score.media{background:#FFF4DC;color:#9A6A0C}.score.baixa{background:#F0F2F5;color:var(--muted)}

/* Painel */
.painel-banner{
  position:relative;isolation:isolate;display:flex;align-items:center;min-height:clamp(205px,25vw,285px);
  margin:0 0 18px;padding:clamp(22px,4vw,42px);overflow:hidden;border:1px solid rgba(221,175,66,.34);
  border-radius:18px;box-shadow:var(--shadow);
  background-image:linear-gradient(90deg,rgba(9,8,7,.82) 0%,rgba(9,8,7,.52) 42%,rgba(9,8,7,.06) 100%),
    var(--painel-banner-image);
  background-position:center 54%;background-size:cover;background-repeat:no-repeat;
}
.painel-banner-copy{max-width:620px;color:#fff}
.painel-banner-copy .eyebrow{display:block;margin-bottom:9px;color:#E7BD59;font-size:.72rem;font-weight:800;letter-spacing:.28em;text-transform:uppercase}
.painel-banner-copy h2{margin:0;color:#fff;font-size:clamp(1.85rem,4.5vw,3.45rem);font-weight:850;line-height:.98;letter-spacing:-.035em;text-transform:uppercase;text-wrap:balance}
.painel-banner-copy p{margin:12px 0 0;color:rgba(255,255,255,.9);font-size:clamp(.78rem,1.5vw,.98rem);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:20px}
.hello h2{font-family:var(--font-display);font-weight:500;font-size:clamp(1.55rem,4.4vw,2.3rem);margin:0;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
.hello h2 em{color:var(--accent);font-style:italic}
.hello p{margin:5px 0 0;color:var(--muted);font-size:.92rem}
.hero{display:grid;grid-template-columns:280px 1fr;gap:14px}
.hero>*{min-width:0}
.goal{background:linear-gradient(160deg,#151A21,#262D38);color:#fff;border:1px solid #151A21;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .in span{font-size:.78rem;color:#AEB6C2;margin-top:4px}
.goal .t{font-weight:800}
.goal .s{font-size:.82rem;color:#C9A562}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{--c:var(--accent);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 13px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c);opacity:.85}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);margin-bottom:8px}
.kpi .ic svg{width:17px;height:17px}
.kpi .l{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.kpi .v{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1.15;margin-top:2px;color:var(--ink)}
.kpi .h{font-size:.78rem;color:var(--muted);margin-top:2px}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.today>*{min-width:0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
.li:first-child{border-top:0;padding-top:2px}
.li .who{min-width:0;flex:1}
.li .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .who span{display:block;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .when{font-size:.78rem;color:var(--muted);white-space:nowrap;text-align:right}
.li .when.late{color:var(--bad);font-weight:800}
.charts{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.charts>*{min-width:0}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center;font-size:.86rem}
.fstep .bar{height:22px;background:#EEF1F5;border-radius:6px;overflow:hidden}
.fstep .bar i{display:block;height:100%;border-radius:6px;background:var(--c);min-width:3px}
.fstep b{text-align:right}
.fconv{font-size:.72rem;color:var(--muted);padding-left:128px;margin:-2px 0 0}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:120px;height:120px;flex-shrink:0;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .in b{font-size:1.5rem;font-weight:800;line-height:1}
.donut .in span{font-size:.72rem;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.legend span{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;padding-left:12px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;font-size:.84rem;align-items:center}
.hb .lab{display:flex;flex-direction:column;gap:4px;min-width:0}
.hb .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{height:6px;background:#EEF1F5;border-radius:99px;overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.hb b{text-align:right}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;background:var(--surface-2)}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--raised)}
tfoot td{font-weight:800;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0;color:var(--accent)}

/* Leads */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0;min-height:40px}
.filters input{flex:1 1 220px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.lead{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:9px;min-width:0;box-shadow:var(--shadow)}
.lead.t-quente{border-left-color:var(--hot)}.lead.t-morno{border-left-color:var(--warm)}.lead.t-frio{border-left-color:var(--cold)}
.lead .head{display:flex;align-items:flex-start;gap:8px}
.lead .name{font-weight:800;font-size:1.05rem;cursor:pointer;min-width:0;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left}
.lead .meta{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.lead .next{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem}
.lead .next.late{border-color:#F5C2BC;background:#FFF5F4}
.lead .next b{color:var(--accent)}
.lead .next.late b{color:var(--bad)}
.temp{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-left:auto;flex-shrink:0}
.temp button{border:0;background:transparent;padding:5px 9px;font-size:.74rem;font-weight:800;cursor:pointer;color:var(--muted);min-height:30px}
.temp button[data-t="quente"][aria-pressed="true"]{background:var(--hot);color:#fff}
.temp button[data-t="morno"][aria-pressed="true"]{background:var(--warm);color:#fff}
.temp button[data-t="frio"][aria-pressed="true"]{background:var(--cold);color:#fff}
.lead .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lead .foot select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:.84rem;min-width:0;max-width:100%;min-height:36px}

/* Scripts */
.scats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scats::-webkit-scrollbar{display:none}
.scats button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:700;font-size:.86rem;color:var(--muted);white-space:nowrap;cursor:pointer;min-height:36px}
.scats button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.scripts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.scard .cat{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--accent)}
.scard h4{margin:0;font-size:1rem}
.scard p{margin:0;font-size:.88rem;color:#3A4250;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.scard .row{margin-top:auto}

/* Vendas */
.top .gear{padding:9px;border-radius:10px}
.top .gear svg{width:20px;height:20px}
.comis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.pessoa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;min-width:0}
.pessoa img{width:54px;height:54px;border-radius:14px;flex-shrink:0;box-shadow:0 0 0 1px #EAD5AE}
.pessoa .nm{font-weight:800}
.pessoa .rec{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;color:var(--green);line-height:1.1}
.pessoa .sm{font-size:.8rem;color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:10px}
.venda{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:8px 14px;min-width:0}
.venda .t{font-weight:800;overflow-wrap:anywhere}
.venda .m{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.venda .v{text-align:right}
.venda .v b{display:block;font-size:1.15rem}
.venda .partes{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.parte{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;font-size:.84rem;background:var(--surface-2)}
.parte b{font-weight:800}
.parte button{border:0;border-radius:99px;padding:5px 10px;font-weight:800;font-size:.76rem;cursor:pointer;min-height:30px}
.parte button[aria-pressed="false"]{background:#FFF4DC;color:#9A6A0C}
.parte button[aria-pressed="true"]{background:#E6F6EC;color:#13804A}
.calc{grid-column:1/-1;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.88rem;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.calc b{text-align:right}
.calc .tot{font-weight:800;border-top:1px solid var(--line);padding-top:6px}

/* Imóveis */
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.prop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0;box-shadow:var(--shadow);text-align:left}
.prop:hover{border-color:var(--accent-line)}
.prop .price{font-weight:800;font-size:1.35rem;color:var(--ink);letter-spacing:-.02em}
.prop .t{font-weight:800;overflow-wrap:anywhere}
.prop .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.prop .stats b{display:block;font-size:1rem;color:var(--ink)}

/* Diálogo */
dialog{border:1px solid var(--line);padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(16,24,40,.25)}
dialog::backdrop{background:rgba(16,24,40,.45)}
.dlg{display:flex;flex-direction:column;max-height:inherit;min-height:0}
.dlg header{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.2rem;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-weight:700;font-size:.84rem;color:var(--muted);white-space:nowrap;cursor:pointer;min-height:34px}
.dtabs button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.dlg .body{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0}
.pane{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.pane>*{min-width:0}
.pane .full{grid-column:1/-1}
.dlg footer{display:flex;gap:8px;padding:12px 18px calc(12px + var(--bot));border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.f{display:flex;flex-direction:column;gap:5px}
.f label,.flabel{font-size:.76rem;font-weight:800;color:var(--muted);letter-spacing:.02em}
.f input,.f select,.f textarea{border:1px solid #D5DAE1;background:#fff;border-radius:10px;padding:10px 11px;width:100%;min-height:42px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(168,117,34,.15)}
.f textarea{min-height:84px;resize:vertical}
.hint{font-size:.78rem;color:var(--muted)}
.sect{grid-column:1/-1;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--accent);margin-top:4px}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.picks button{border:1px solid #D5DAE1;background:#fff;border-radius:99px;padding:6px 11px;cursor:pointer;font-weight:700;font-size:.84rem;color:var(--muted);min-height:34px}
.picks button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.tempPick{display:flex;gap:6px}
.tempPick button{flex:1;border:1px solid #D5DAE1;background:#fff;border-radius:10px;padding:10px;cursor:pointer;font-weight:800;color:var(--muted);min-height:42px}
.tempPick button[data-t="quente"][aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
.tempPick button[data-t="morno"][aria-pressed="true"]{background:var(--warm);border-color:var(--warm);color:#fff}
.tempPick button[data-t="frio"][aria-pressed="true"]{background:var(--cold);border-color:var(--cold);color:#fff}
.scorebox{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.scorebox .n{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.scorebox .bar{flex:1;height:8px;background:#E3E6EB;border-radius:99px;overflow:hidden}
.scorebox .bar i{display:block;height:100%;border-radius:99px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.timeline li{display:flex;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.88rem;overflow-wrap:anywhere}
.timeline li .dot{margin-top:6px}
.timeline li small{display:block;color:var(--muted);font-size:.74rem}
.addnote{display:grid;grid-template-columns:150px 1fr auto;gap:8px}
.addnote select,.addnote input{border:1px solid #D5DAE1;background:#fff;border-radius:10px;padding:9px 10px;min-width:0;min-height:42px}
.sugg{grid-column:1/-1;background:linear-gradient(160deg,#FFF8EA,#fff 65%);border:1px solid var(--accent-line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sugg .why{font-size:.8rem;color:var(--muted)}
.sugg .why b{color:var(--accent)}
.sugg textarea{border:1px solid #D5DAE1;background:#fff;border-radius:10px;padding:11px;min-height:150px;width:100%;resize:vertical;line-height:1.45}
.cad{grid-column:1/-1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.74rem;font-weight:800;padding:4px 9px;border-radius:99px;background:#E9ECF1;color:var(--muted)}
.steps span.done{background:#E6F6EC;color:#13804A}
.steps span.now{background:var(--primary);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(30px + var(--bot));transform:translateX(-50%);background:var(--primary);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:.9rem;z-index:60;max-width:min(440px,calc(100vw - 32px));text-align:center;line-height:1.35;box-shadow:0 10px 30px rgba(16,24,40,.25)}
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(26px + var(--bot));z-index:25;border-radius:99px;padding:14px 20px;box-shadow:0 10px 26px rgba(16,24,40,.28);min-height:50px}
.settings{display:flex;flex-direction:column;gap:12px}
.auth{max-width:400px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.auth img{width:64px;height:64px;border-radius:16px;box-shadow:0 2px 8px rgba(16,24,40,.12),0 0 0 1px #EAD5AE}
.auth h2{font-family:var(--font-display);font-weight:600;font-size:1.6rem;margin:4px 0 0;letter-spacing:-.02em}
.auth p{margin:0;color:var(--muted);font-size:.92rem}
.auth .err{color:var(--bad);font-weight:700;font-size:.88rem}
.auth .ok{color:var(--good);font-weight:700;font-size:.88rem}
.auth .link{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0;align-self:flex-start}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
input[type="date"],input[type="datetime-local"]{color-scheme:light;-webkit-appearance:none;appearance:none;text-align:left}
input[type="date"]::-webkit-date-and-time-value,input[type="datetime-local"]::-webkit-date-and-time-value{text-align:left}

@media (max-width:980px){
  .hero{grid-template-columns:1fr}
  .goal{flex-direction:row;justify-content:flex-start;text-align:left;gap:16px}
  .ring{width:110px;height:110px}.ring .in b{font-size:1.6rem}
  .today{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
}
@media (max-width:760px){
  header.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff}
  .top .wrap{padding-block:10px}
  .brand .sync{display:none}
  img.mono{width:40px;height:40px;border-radius:11px}
  .brand h1{font-size:1.18rem}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.98);box-shadow:0 -4px 16px rgba(16,24,40,.06);border-top:1px solid var(--line);justify-content:space-around;
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + var(--bot)) max(6px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:3px;font-size:.64rem;padding:6px 2px;flex:1;min-width:0;min-height:50px;justify-content:center;border-radius:12px}
  .tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .tab svg{width:21px;height:21px}
  .top .gear{flex:0 0 auto;width:42px;min-height:42px;padding:9px;flex-direction:row}
  .venda{grid-template-columns:1fr}
  .venda .v{text-align:left}
  main{padding-bottom:calc(150px + var(--bot))}
  .fab{bottom:calc(84px + var(--bot))}
  .toast{bottom:calc(150px + var(--bot))}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .v{font-size:1.35rem}
  .cards,.scripts,.props{grid-template-columns:1fr}
  .pane{grid-template-columns:1fr}
  .addnote{grid-template-columns:1fr 1fr}
  .addnote input{grid-column:1/-1;grid-row:1}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:20px 20px 0 0;border-bottom:0;max-height:92vh;max-height:92dvh}
  .fstep{grid-template-columns:96px 1fr 30px}
  .fconv{padding-left:106px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters input{grid-column:1/-1}
  .filters .seg{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr)}
  .filters select,.filters .btn{width:100%;min-width:0}
  .lead .foot select{flex:1 1 100%}
  .lead .foot .spacer{display:none}
  .lead .foot .btn{flex:1}
  .lead .foot .btn.wa{flex:0 0 52px}
  .lead .head{flex-wrap:wrap}
  .fab{width:58px;height:58px;padding:0;font-size:0;border-radius:50%}
  .fab::before{content:"+";font-size:2rem;font-weight:500;line-height:1}
  /* iPhone: campos com 16px não dão zoom ao tocar */
  input,select,textarea{font-size:16px!important}
  .seg button{padding:8px 10px}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}

/* Ajuste final de navegação responsiva:
   desktop mantém o menu no cabeçalho; celular usa barra fixa inferior. */

  .top .wrap{display:flex;align-items:center;flex-wrap:nowrap}

}
@media (max-width:760px){
  /* Sem filtro no ancestral para a barra fixa acompanhar a janela inteira. */
  header.top{position:sticky;top:0;z-index:20;background:rgba(12,10,8,.98);backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
