async function waLoadConversations() {
  if (!sb || !donoId) return;
  waPanelState.loading = true;
  const { data, error } = await sb.from("whatsapp_conversations").select("*").eq("owner_user_id", donoId).order("last_message_at", { ascending: false }).limit(100);
  waPanelState.loading = false;
  if (error) { toast("Não foi possível carregar WhatsApp: " + error.message); return; }
  waPanelState.conversations = data || [];
  if (!waPanelState.selectedId && waPanelState.conversations.length) waPanelState.selectedId = waPanelState.conversations[0].id;
  if (waPanelState.selectedId && !waPanelState.conversations.some(c => c.id === waPanelState.selectedId)) waPanelState.selectedId = waPanelState.conversations[0]?.id || null;
  await waLoadMessages();
}
async function waLoadMessages() {
  if (!waPanelState.selectedId) { waPanelState.messages = []; waRender(); return; }
  const { data, error } = await sb.from("whatsapp_messages").select("*").eq("conversation_id", waPanelState.selectedId).order("message_timestamp", { ascending: true }).limit(300);
  if (error) { toast("Não foi possível carregar mensagens: " + error.message); return; }
  waPanelState.messages = data || [];
  waRender();
}
function waRender() {
  if (view !== "whatsapp") return;
  const app = document.querySelector("#app");
  if (app) { app.innerHTML = waHtml(); waBind(); }
}
function waBind() {
  document.querySelectorAll("[data-wa-select]").forEach(b => b.onclick = async () => { waPanelState.selectedId = b.dataset.waSelect; waPanelState.mobileChatOpen = true; await waLoadMessages(); });
  const backToList = document.getElementById("waBackToList"); if (backToList) backToList.onclick = () => { waPanelState.mobileChatOpen = false; waRender(); };
  const search = document.getElementById("waSearch"); if (search) search.oninput = () => { waPanelState.search = search.value; waRender(); const next = document.getElementById("waSearch"); if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); } };
  const refresh = document.getElementById("waRefresh"); if (refresh) refresh.onclick = async () => { await waLoadConversations(); };
  const pause = document.getElementById("waPause"); if (pause) pause.onclick = async () => {
    const c = waSelected(); if (!c) return;
    const { error } = await sb.from("whatsapp_conversations").update({ ai_paused: true, human_handoff_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq("id", c.id).eq("owner_user_id", donoId);
    if (error) toast("Não foi possível pausar: " + error.message); else { toast("IA pausada nesta conversa"); await waLoadConversations(); }
  };
  const resume = document.getElementById("waResume"); if (resume) resume.onclick = async () => {
    const c = waSelected(); if (!c) return;
    if (c.qualification_status === "complete" || c.qualification_status === "needs_human") { toast("A qualificação terminou. O corretor deve continuar."); return; }
    const { error } = await sb.from("whatsapp_conversations").update({ ai_paused: false, human_handoff_at: null, updated_at: new Date().toISOString() }).eq("id", c.id).eq("owner_user_id", donoId);
    if (error) toast("Não foi possível retomar: " + error.message); else { toast("Qualificação retomada"); await waLoadConversations(); }
  };
  const openLead = document.getElementById("waOpenLead"); if (openLead) openLead.onclick = () => { const c = waSelected(); if (c?.lead_id) abrirLead(c.lead_id); };
  const form = document.getElementById("waCompose"); if (form) form.onsubmit = async e => {
    e.preventDefault(); const c = waSelected(); const input = document.getElementById("waText"); const button = document.getElementById("waSend");
    const text = (input?.value || "").trim(); if (!c || !text) return;
    button.disabled = true; button.textContent = "Enviando…";
    const { data, error } = await sb.functions.invoke("zapclaw-send", { body: { conversation_id: c.id, text } });
    button.disabled = false; button.textContent = "Enviar";
    if (error || !data?.ok) { toast("Não foi possível enviar: " + (data?.error || error?.message || "erro")); return; }
    input.value = "";
    toast(data.status === "held_for_approval" ? "Envio aguardando aprovação no ZapClaw" : data.status === "delivery_unknown" ? "Entrega incerta. Confira o status no ZapClaw antes de reenviar." : "Mensagem aceita para envio pelo CRM");
    await waLoadConversations();
  };
  const box = document.getElementById("waMessages"); if (box) box.scrollTop = box.scrollHeight;
}

const renderWithoutWhatsapp = render;
render = function() {
  if (view !== "whatsapp") return renderWithoutWhatsapp();
  if (!sessao) return;
  modoSemLogin(false);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.view === "whatsapp" ? "page" : "false"));
  const fab = document.getElementById("fab"); if (fab) fab.hidden = true;
  const app = document.querySelector("#app"); if (app) app.innerHTML = '<div class="loading">Carregando conversas…</div>';
  waLoadConversations();
};

// Atualiza a tela quando houver novas mensagens no Supabase Realtime.
function waSubscribeRealtime() {
  if (!sb || !sessao || !donoId) return;
  if (waPanelState.channel) sb.removeChannel(waPanelState.channel);
  waPanelState.channel = sb.channel("wa-inbox-" + donoId)
    .on("postgres_changes", { event: "*", schema: "public", table: "whatsapp_messages" }, async () => { if (view === "whatsapp") await waLoadConversations(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "whatsapp_conversations" }, async () => { if (view === "whatsapp") await waLoadConversations(); })
    .subscribe();
}
const entrarBase = entrar;
entrar = async function() { await entrarBase(); waSubscribeRealtime(); };

// Permite restaurar a aba WhatsApp depois de atualizar o navegador.
try { if (localStorage.getItem(LS_KEY + "-view") === "whatsapp") view = "whatsapp"; } catch (_) {}


init();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
})();
</script>

<script id="jm-glass-interactions">
(function(){
  "use strict";
  const root=document.documentElement;
  const body=document.body;
  const themeBtn=document.getElementById("jmThemeToggle");
  const themeLabel=document.getElementById("jmThemeLabel");
  const themeIcon=document.getElementById("jmThemeIcon");
  const railBtn=document.getElementById("jmRailToggle");
  const title=document.getElementById("jmCurrentTitle");
  const date=document.getElementById("jmToday");
  function installLogoFallback(img){
    if(!img||img.dataset.fallbackBound)return;
    img.dataset.fallbackBound="1";
    const replace=()=>{
      if(img.dataset.fallbackDone||!img.isConnected)return;
      img.dataset.fallbackDone="1";
      const fallback=document.createElement("span");
      fallback.className="jm-logo-fallback";
      fallback.textContent="JM";
      fallback.setAttribute("aria-label",img.alt||"Logo JM");
      img.replaceWith(fallback);
    };
    img.addEventListener("error",replace,{once:true});
    if(img.complete&&img.naturalWidth===0)replace();
  }
  document.querySelectorAll('img[src*="logo-mark"]').forEach(installLogoFallback);
  new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{
    if(node.nodeType!==1)return;
    if(node.matches?.('img[src*="logo-mark"]'))installLogoFallback(node);
    node.querySelectorAll?.('img[src*="logo-mark"]').forEach(installLogoFallback);
  }))).observe(document.body,{childList:true,subtree:true});
  const titles={painel:"Painel de atendimento",leads:"Leads",vendas:"Vendas",scripts:"Scripts de atendimento",imoveis:"Imóveis",gastos:"Campanhas",ajustes:"Ajustes",whatsapp:"WhatsApp"};
  const sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>';
  const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.6 8.6 0 1 0 20.2 15.3Z"/></svg>';
  function setTheme(theme){
    const next=theme==="light"?"light":"dark";
    root.dataset.theme=next;
    root.style.colorScheme=next;
    try{localStorage.setItem("carteira-jm-theme",next)}catch(_){}
    if(themeBtn){themeBtn.setAttribute("aria-pressed",String(next==="light"));themeBtn.setAttribute("aria-label",next==="dark"?"Ativar tema claro":"Ativar tema escuro")}
    if(themeLabel)themeLabel.textContent=next==="dark"?"Tema claro":"Tema escuro";
    if(themeIcon)themeIcon.innerHTML=next==="dark"?sun:moon;
  }
  let initial="dark";
  try{const saved=localStorage.getItem("carteira-jm-theme");if(saved==="light"||saved==="dark")initial=saved}catch(_){}
  setTheme(initial);
  themeBtn?.addEventListener("click",()=>setTheme(root.dataset.theme==="dark"?"light":"dark"));

  let rail=false;
  try{rail=localStorage.getItem("carteira-jm-rail")==="collapsed"}catch(_){}
  function setRail(collapsed){
    rail=!!collapsed;
    body.classList.toggle("is-rail",rail);
    if(railBtn){railBtn.setAttribute("aria-label",rail?"Expandir menu":"Recolher menu");railBtn.title=rail?"Expandir menu":"Recolher menu"}
    try{localStorage.setItem("carteira-jm-rail",rail?"collapsed":"expanded")}catch(_){}
  }
  setRail(rail);
  railBtn?.addEventListener("click",()=>setRail(!rail));

  function updateTitle(){
    const active=document.querySelector('nav.tabs .tab[aria-current="page"]');
    if(title&&active){const key=active.dataset.view;title.textContent=titles[key]||active.textContent.trim()||"Carteira JM"}
  }
  const nav=document.querySelector("nav.tabs");
  if(nav){
    new MutationObserver(updateTitle).observe(nav,{subtree:true,childList:true,attributes:true,attributeFilter:["aria-current","data-view"]});
    nav.addEventListener("click",()=>requestAnimationFrame(updateTitle));
  }
  updateTitle();
  if(date){date.textContent=new Date().toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"})}
  const app=document.getElementById("app");
  if(app){
    const animate=()=>{
      const first=app.firstElementChild;
      if(!first||first.classList.contains("loading")||first.classList.contains("auth"))return;
      first.classList.remove("jm-enter");
      void first.offsetWidth;
      first.classList.add("jm-enter");
      updateTitle();
    };
    new MutationObserver(()=>requestAnimationFrame(animate)).observe(app,{childList:true});
  }
})();
</script>

      tools.append(search,status);
      const titleRow=props.previousElementSibling;
      if(titleRow&&titleRow.classList.contains("row"))titleRow.insertAdjacentElement("afterend",tools);
      else props.insertAdjacentElement("beforebegin",tools);
    }
    applyPropertyFilters();
  }

  let scheduled=false;
  function refreshMobileEnhancements(){
    if(scheduled)return;
    scheduled=true;
    requestAnimationFrame(()=>{
      scheduled=false;
      adaptDatePickers();
      compactLeadGroups();
      enhanceProperties();
      const chatOpen=!!document.querySelector("#app .wa-shell.wa-mobile-chat-open");
      document.body.classList.toggle("jm-mobile-whatsapp-chat",mobile.matches&&chatOpen);
    });
  }
  const app=document.getElementById("app");
  if(app){
    new MutationObserver(refreshMobileEnhancements).observe(app,{childList:true,subtree:true});
    refreshMobileEnhancements();
  }
  window.addEventListener("resize",refreshMobileEnhancements,{passive:true});
})();

</script>
